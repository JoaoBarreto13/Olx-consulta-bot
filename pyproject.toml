[project]
name = "olx-telegram-monitor"
version = "0.1.0"
description = "Bot Telegram para monitorar perfis públicos da OLX."
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
olx-bot = "app.main:run"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
